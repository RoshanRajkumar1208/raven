[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-api"
dynamic = ["version"]
description = "RAVEN (REST API Validation Engine): security configuration and contract checks for REST APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Roshan Rajkumar"}]
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]
keywords = ["api-security", "openapi", "swagger", "postman", "appsec", "devsecops", "dast", "security-headers", "cors"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RoshanRajkumar1208/raven"
Portfolio = "https://roshanrajkumar1208.github.io"

[project.scripts]
raven = "raven_api.cli:main"

[tool.setuptools.dynamic]
version = {attr = "raven_api.__version__"}

[tool.setuptools.packages.find]
include = ["raven_api*"]

[tool.setuptools.package-data]
"raven_api.demo" = ["openapi.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
